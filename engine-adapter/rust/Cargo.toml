[package]
name = "foreverbots-wasm"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forever-engine = { git = "https://github.com/sage3648/mythicsim-forever-engine.git", rev = "375fd33d6c5745f9b4732dc4c6c72700d5c3fb2f" }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
