name: Weekly Engine Update

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ForeverBots
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check latest upstream mythicsim-forever-engine commit
        id: check
        run: |
          CURRENT_REV=$(grep -oE 'rev = "[0-9a-f]{40}"' engine-adapter/rust/Cargo.toml | head -n1 | cut -d'"' -f2)
          LATEST_REV=$(git ls-remote https://github.com/sage3648/mythicsim-forever-engine.git HEAD | awk '{print $1}')
          echo "Current pinned rev: $CURRENT_REV"
          echo "Latest upstream rev: $LATEST_REV"
          echo "current=$CURRENT_REV" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_REV" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST_REV" ] || [ "$CURRENT_REV" = "$LATEST_REV" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned engine commit
        if: steps.check.outputs.changed == 'true'
        run: |
          OLD="${{ steps.check.outputs.current }}"
          NEW="${{ steps.check.outputs.latest }}"
          sed -i "s/${OLD}/${NEW}/g" engine-adapter/rust/Cargo.toml
          sed -i "s/${OLD}/${NEW}/g" .github/workflows/engine-verification.yml
          sed -i "s/${OLD}/${NEW}/g" README.md

      - name: Install Rust toolchain to verify new engine builds
        if: steps.check.outputs.changed == 'true'
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.99.1

      - name: Install wasm-pack
        if: steps.check.outputs.changed == 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Verify WASM build with updated engine
        if: steps.check.outputs.changed == 'true'
        working-directory: engine-adapter/rust
        env:
          RUSTFLAGS: '-C link-arg=--max-memory=268435456'
        run: wasm-pack build --target web --release --out-dir ../../artifacts/wasm-web-check

      - name: Commit and push updated engine pin
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine-adapter/rust/Cargo.toml .github/workflows/engine-verification.yml README.md
          SHORT_REV=$(echo "${{ steps.check.outputs.latest }}" | cut -c1-7)
          git commit -m "chore(engine): update mythicsim-forever-engine to ${SHORT_REV}"
          git push origin main
